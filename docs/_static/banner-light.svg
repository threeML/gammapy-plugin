    <g transform="translate(6,6) scale(0.42)">
      <path class="pi" d="M 10.499686,177.03840 L 31.174931,178.56990 C 52.615925,154.32116 61.039171,82.595924 187.38789,96.634671 C 182.79339,403.95560 48.021426,436.37234 56.444675,499.41907 C 59.507674,535.15406 87.840417,557.10556 118.47041,558.38181 C 215.21014,555.06356 210.87089,424.63084 240.99038,95.868921 L 365.80760,95.868921 C 359.17110,211.75239 341.04836,327.63586 339.00636,441.22208 C 340.53786,516.77606 386.48285,557.10556 446.97708,557.61606 C 546.52456,560.93431 577.92030,444.79558 577.92030,395.27709 L 556.47931,395.27710 C 554.43731,436.11709 534.78306,465.47083 492.92207,467.25758 C 378.82535,468.78908 441.61683,266.63113 442.38258,97.400421 L 577.92030,98.166171 L 577.15455,11.636437 C 13.807491,8.9075799 85.312284,-2.1366151 10.499686,177.03840 z"/>
    </g>

    <!-- γ (exact path) -->
    <g transform="translate(-60,-6) scale(0.64)">
      <path class="gamma" d="m244.01 120.88h38.169l-74.299 155.82q2.7774 25.014 2.7774 43.727 0 52.065-19.455 52.065-14.081 0-14.081-21.864 0-28.534 20.751-71.52-4.0749-26.681-11.487-64.294-7.2261-37.613-15.008-53.918-7.5968-16.305-21.864-16.305-23.346 0-25.014 34.834h-6.6702q0-61.144 36.316-61.144 20.937 0 31.128 24.828 10.191 24.643 20.938 107.47z"/>
    </g>
  </svg>

  <!-- Wordmark -->
  <g class="text" transform="translate(270,100)">
    <text class="sub" x="0" y ="0" font-size="28" font-weight="500">A</text>
    <text class="gamma" x="28" y="0" font-size="52" font-weight="700">gammapy</text>
    <text class="sub" x="0" y="52" font-size="28" font-weight="500">plugin for</text>
    <text x="135" y="52" font-size="52" font-weight="800" class="brand">threeML</text>
  </g>
</svg>
