name: CI

on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - "README.md"
      - "**/docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - master
      - dev
  schedule:
    - cron: "0 11 * * 1"

jobs:
  skip_duplicate:
        runs-on: ubuntu-latest
        outputs:
            should_skip: ${{ steps.skip_check.outputs.should_skip }}
        steps:
            - id: skip_check
              uses: fkirc/skip-duplicate-actions@master
              with:
                  github_token: ${{ github.token }}
                  concurrent_skipping: never
                  skip_after_successful_duplicate: true
                  paths_ignore: '["**/README.md", "**/docs/**"]'
                  do_not_skip: '["pull_request",  "schedule"]'

  test-dev-units: # temporary test while improving units handling in astromodels and threeml
    name: Build and Test units-dev(${{ matrix.os}}, Python ${{ matrix.python-version}})
    needs: skip_duplicate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            gammapy_data: /home/runner/work/gammapy_data
          - os: ubuntu-latest
            python-version: "3.11"
            gammapy_data: /home/runner/work/gammapy_data

    if: ${{ github.event_name == 'push'  && github.ref == 'refs/heads/dev' }}

    env:
      GAMMAPY_DATA: ${{ matrix.gammapy_data }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools flake8 ipython h5py coverage pytest pytest-cov cython codecov pytest-xdist
          pip install --upgrade git+https://github.com/PreisTo/astromodels.git@sampling_units
          pip install --upgrade git+https://github.com/PreisTo/threeML.git@sampling_units
          pip install --upgrade git+https://github.com/gammapy/gammapy.git@main

      - name: Lint with flake8
        run: |
          flake8 . --count --show-source --statistics

      - name: Test with pytest
        run: |
          git clone https://github.com/gammapy/gammapy-data.git $GAMMAPY_DATA
          pip install .
          python -m gammapy_plugin.data.create_test_datasets
          pytest -vv --cov=gammapy_plugin/ --cov-report=xml -n auto --dist worksteal
        env:
          NUMBA_DISABLE_JIT: 0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-dev:
    name: Build and Test gammapy@main (${{ matrix.os}}, Python ${{ matrix.python-version}})
    needs: skip_duplicate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            gammapy_data: /home/runner/work/gammapy_data
          - os: ubuntu-latest
            python-version: "3.11"
            gammapy_data: /home/runner/work/gammapy_data

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    env:
      GAMMAPY_DATA: ${{ matrix.gammapy_data }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools flake8 ipython h5py coverage pytest pytest-cov cython codecov pytest-xdist
          pip install --upgrade --pre astromodels 
          pip install --upgrade --pre threeML
          pip install --upgrade git+https://github.com/gammapy/gammapy.git@main

      - name: Lint with flake8
        run: |
          flake8 . --count --show-source --statistics

      - name: Test with pytest
        run: |
          git clone https://github.com/gammapy/gammapy-data.git $GAMMAPY_DATA
          pip install .
          python -m gammapy_plugin.data.create_test_datasets
          pytest -vv --cov=gammapy_plugin/ --cov-report=xml -n auto --dist worksteal
        env:
          NUMBA_DISABLE_JIT: 0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}


  test-main:
    name: Build and Test (${{ matrix.os}}, Python ${{ matrix.python-version}})
    needs: skip_duplicate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            gammapy_data: /home/runner/work/gammapy_data
          - os: ubuntu-latest
            python-version: "3.11"
            gammapy_data: /home/runner/work/gammapy_data

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }} 

    env:
      GAMMAPY_DATA: ${{ matrix.gammapy_data }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools flake8 ipython h5py coverage pytest pytest-cov cython codecov pytest-xdist
          pip install .

      - name: Lint with flake8
        run: |
          flake8 . --count --show-source --statistics

      - name: Test with pytest
        run: |
          git clone https://github.com/gammapy/gammapy-data.git $GAMMAPY_DATA
          python -m gammapy_plugin.data.create_test_datasets
          pytest -vv --cov=gammapy_plugin/ --cov-report=xml -n auto --dist worksteal
        env:
          NUMBA_DISABLE_JIT: 0
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}


  package:
    name: Build & verify package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: pip

      - name: Install twine
        run: python -m pip install twine
      - name: Build package
        run: |
              pip install --upgrade setuptools
              pip install --upgrade build
              python -m build 
      - name: List result
        run: ls -l dist
      - name: Check long_description
        run: python -m twine check dist/*

