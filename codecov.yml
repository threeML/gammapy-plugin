coverage:
  precision: 2
  round: down
  range: 70..100

  status:
    project:
      default:
        target: auto
        threshold: 5
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 0
    changes: false

ignore:
  - "gammapy_plugin/test"
  - "gammapy_plugin/_version.py"

comment:
    layout: "condensed_header, condensed_files, condensed_footer"
    behavior: default
