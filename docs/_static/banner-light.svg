<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Gammapy plugin for 3ML wordmark with icon">
  <style>
    /* Icon palette */
    .q1 { fill: #1E90FF; }  /* NE */
    .q2 { fill: #22C55E; }  /* SE */
    .q3 { fill: #F59E0B; }  /* SW */
    .q4 { fill: #E5391B; }  /* NW */
    .gamma { fill: #E5391B; }
    .pi { fill: #3F3F46; }

    /* Text palette */
    .text { fill: #000000; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif; }
    .sub { fill: #000000; }
    .brand { fill: #000000; }
  </style>

  <!-- Icon block (nested 256×256 SVG scale3to 220×220 so glyphs fit perfectly) -->
  <svg x="20" y="20" width="220" height="220" viewBox="0 0 256 256">
