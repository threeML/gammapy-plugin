    <path class="q1" d="M128 28A100 100 0 0 1 228 128L128 128Z"/>
    <path class="q2" d="M228 128A100 100 0 0 1 128 228L128 128Z"/>
    <path class="q3" d="M128 228A100 100 0 0 1 28 128L128 128Z"/>
    <path class="q4" d="M28 128A100 100 0 0 1 128 28L128 128Z"/>

