name: CI
on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - "README.md"
      - "**/docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - master
      - dev
  schedule:
    - cron: "0 11 * * 1"
  release:
    types: [published]

jobs:
  skip_duplicate:
        runs-on: ubuntu-slim
        outputs:
            should_skip: ${{ steps.skip_check.outputs.should_skip }}
        steps:
            - id: skip_check
              uses: fkirc/skip-duplicate-actions@master
              with:
                  github_token: ${{ github.token }}
                  concurrent_skipping: never
                  skip_after_successful_duplicate: true
                  paths_ignore: '["**/README.md", "**/docs/**"]'
                  do_not_skip: '["pull_request",  "schedule"]'

  test-dev:
    name: Build and Test gammapy@main (${{ matrix.os}}, Python ${{ matrix.python-version}})
    needs: skip_duplicate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.12","3.13"]
        gammapy_data: ["/home/runner/work/gammapy_data"]

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}

    env:
      GAMMAPY_DATA: ${{ matrix.gammapy_data }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip flake8 coverage pytest pytest-cov pytest-xdist
          pip install --upgrade --pre astromodels 
          pip install --upgrade --pre threeML
          pip install -e ".[tests]"
          pip install --upgrade git+https://github.com/gammapy/gammapy.git@main
          pip install --upgrade ultranest

      - name: Lint with flake8
        run: |
          flake8 . --count --show-source --statistics
      - name: List installed packages
        run: |
          pip freeze
      - name: Test with pytest
        run: |
          git clone https://github.com/gammapy/gammapy-data.git $GAMMAPY_DATA
          pytest -vv --cov=gammapy_plugin --cov-report=xml --cov-report=term 
        env:
          NUMBA_DISABLE_JIT: 0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml 


  test-main:
    name: Build and Test (${{ matrix.os}}, Python ${{ matrix.python-version}})
    needs: skip_duplicate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.12","3.13"]
        gammapy_data: ["/home/runner/work/gammapy_data"]
       
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main') }} 
    env:
      GAMMAPY_DATA: ${{ matrix.gammapy_data }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip flake8 coverage pytest pytest-cov pytest-xdist
          pip install ultranest

      - name: Lint with flake8
        run: |
          flake8 . --count --show-source --statistics

      - name: Test with pytest
        run: |
          git clone https://github.com/gammapy/gammapy-data.git $GAMMAPY_DATA
          pip install -e ".[tests]"
          pytest -vv --cov=gammapy_plugin --cov-report=xml --cov-report=term 
        env:
          NUMBA_DISABLE_JIT: 0
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml 


  package:
    name: Build & verify package
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.11
          cache: pip

      - name: Install twine
        run: python -m pip install twine
      - name: Build package
        run: |
              pip install --upgrade setuptools
              pip install --upgrade build
              python -m build 
      - name: List result
        run: ls -l dist
      - name: Check long_description
        run: python -m twine check dist/*

  publish-test:
    name: Publish to TestPyPI
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build package
        run: |
          pip install --upgrade build
          python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    name: Publish to PyPI
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (no API token needed)

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build package
        run: |
          pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
